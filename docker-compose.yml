services:
  ledgerpro:
    build:
      context: .
      dockerfile: Dockerfile
    image: ledgerpro:latest
    container_name: ledgerpro-app
    restart: unless-stopped
    # Exposing exclusively on port 8001
    # Port 3304 is reserved for the host machine's external database instance and has zero conflict
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
