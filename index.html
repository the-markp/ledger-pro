<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>LedgerPro - Engineering Project Billing & Payment Tracker</title>
    <meta name="description" content="Comprehensive transaction ledger, payment status tracking in Philippine Peso (₱), weekly and monthly spending reports, and instant export to Excel and PDF." />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LedgerPro" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="LedgerPro - Engineering Project Billing & Payment Tracker" />
    <meta property="og:description" content="Comprehensive transaction ledger, payment status tracking in Philippine Peso (₱), weekly and monthly spending reports, and instant export to Excel and PDF." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker if supported
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
